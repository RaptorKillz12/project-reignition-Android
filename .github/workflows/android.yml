
name: Project Reignition Android

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v1.0.x

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: "Project"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Project Reignition
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

          sdkmanager --list_installed

      - name: Download Godot 4.7.2 .NET
        run: |
          set -euo pipefail

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          GODOT_DIR="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"

          test -f "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          test -d "$GODOT_DIR/GodotSharp"

          sudo install -m 755 \
            "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" \
            /usr/local/bin/godot

          sudo cp -r "$GODOT_DIR/GodotSharp" /usr/local/bin/

      - name: Verify Godot and .NET
        run: |
          set -euo pipefail
          godot --version
          dotnet --version

      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -f project.godot
          godot --headless --path . --editor --quit

      - name: Restore C# dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          dotnet restore

      - name: Build C# project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          dotnet build -c Release --no-restore

      - name: Create Android export preset
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../Project-Reignition-Android.apk"

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          package/unique_name="com.raptorkillz.projectreignition"
          package/name="Project Reignition"
          package/signed=true

          version/code=1
          version/name="1.0.8"

          screen/immersive_mode=true
          screen/edge_to_edge=true

          graphics/opengl3=true
          graphics/vulkan=false

          xr_features/xr_mode=false

          launcher_icons/main_192x192="res://interface/boot/Icon.png"
          EOF

      - name: Install Godot Android export templates
        run: |
          set -euo pipefail

          TEMPLATE_VERSION="${GODOT_VERSION}.stable.mono"
          TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"

          mkdir -p "$TEMPLATE_PATH"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" \
            -O templates.tpz

          unzip -q templates.tpz -d templates

          TEMPLATE_DIR="$(find templates -type d -name android -print -quit)"
          test -n "$TEMPLATE_DIR"
          test -d "$TEMPLATE_DIR"

          cp -r "$TEMPLATE_DIR"/* "$TEMPLATE_PATH"/

          test -n "$(find "$TEMPLATE_PATH" -type f -print -quit)"

      - name: Configure Android SDK for Godot
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Export Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          godot \
            --headless \
            --path . \
            --editor \
            --export-release "Android" \
            ../Project-Reignition-Android.apk

          test -s ../Project-Reignition-Android.apk

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="Project-Reignition-Android.apk"

          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Reignition-Android
          path: Project-Reignition-Android.apk
          if-no-files-found: error
